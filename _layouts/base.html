<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }} — Abhishek Shukla</title>
  {%- assign desc = page.summary | default: page.description %}
  <meta name="description" content="{{ desc | strip_html | escape }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <meta name="author" content="Abhishek Shukla" />
  <meta name="theme-color" content="#0b0f17" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta property="og:type" content="{% if page.collection == 'notes' %}article{% else %}website{% endif %}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:title" content="{{ page.title | escape }}" />
  <meta property="og:description" content="{{ desc | strip_html | escape }}" />
  <meta property="og:image" content="{{ '/og-image.png' | absolute_url }}" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="nav">
    <a href="/" class="logo"><span class="logo-mark" aria-hidden="true">AS</span><span class="logo-name">Abhishek Shukla</span></a>
    <button type="button" class="nav-toggle" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span>
    </button>
    <nav class="nav-links" aria-label="Main">
      <a href="/#work">Work</a>
      <a href="/learning/"{% if page.url contains '/learning/' %} aria-current="page"{% endif %}>Learning</a>
      <a href="/play/"{% if page.url contains '/play/' %} aria-current="page"{% endif %}>Play</a>
      <a href="/#principles">How I work</a>
      <a href="/career/"{% if page.url contains '/career/' %} aria-current="page"{% endif %}>Career</a>
      <button type="button" class="theme-btn" aria-label="Theme: System. Click to switch." title="Theme: System. Click to switch.">
        <svg class="i-system" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <svg class="i-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <span class="theme-text">Theme: System</span>
      </button>
      <button type="button" class="term-btn mono" title="Open terminal (press ~ or T)" aria-label="Open terminal">&gt;_</button>
      <a href="/#contact" class="btn btn-small">Contact</a>
    </nav>
  </header>

  <main>
{{ content }}
  </main>

  <footer class="footer mono muted">
    Designed &amp; built by Abhishek Shukla · <span id="year"></span>
  </footer>

  <script src="/script.js"></script>
  <script src="/learning.js"></script>
  <script src="/terminal.js"></script>
  {%- for src in page.scripts %}
  <script src="{{ src }}"></script>
  {%- endfor %}
</body>
</html>
