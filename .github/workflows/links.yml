name: Link check

# Catches dead links (a renamed repo, a moved profile) once a week
# and whenever the page changes.
on:
  push:
    branches: [master]
    paths: ["**.html", "**.md", "_notes/**"]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn and LeetCode block automated checks, and localhost only works on your
          # own machine, so they are skipped. Email links are skipped by default.
          args: >-
            --no-progress
            --exclude "linkedin\.com"
            --exclude "leetcode\.com"
            --exclude "localhost"
            --accept 200,206,429
            index.html work/*.html _notes/*.md README.md
          fail: true
