name: Link check

# Catches dead links (a renamed repo, a moved profile) once a week
# and whenever the page changes.
on:
  push:
    branches: [master]
    paths: ["**.html", "**.md"]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn blocks automated checks, so it is skipped
          args: >-
            --no-progress
            --exclude-mail
            --exclude "linkedin\.com"
            --accept 200,206,429
            index.html README.md
          fail: true
