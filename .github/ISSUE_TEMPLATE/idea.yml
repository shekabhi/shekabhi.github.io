name: Idea / improvement
description: Something to add or change on the site
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should we add or change?
      placeholder: e.g. Add a `resume` command to the terminal
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
