# Topic catalogue: groups the learning notes by area.
# A note belongs to a topic by naming its id in front matter, e.g.  catalog: rate-limiting
# `section` puts an area on a Learning section page (see _data/sections.yml).
# Areas without a section appear only in the private plan view (/learning/topics/ after `plan on`).
# Visitors see only topics that have notes.

